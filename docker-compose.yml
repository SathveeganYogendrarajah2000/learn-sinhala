# ===========================================
# Learn Sinhala - Local Docker Compose
# Usage: docker-compose up --build
# Reads secrets from .env file
# ===========================================

services:
  # ===========================================
  # Spring Boot Backend
  # ===========================================
  backend:
    image: sathveegan/learn-sinhala-backend:${BACKEND_VERSION:-latest}
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:4200,http://localhost:80
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ===========================================
  # Angular Frontend (Nginx)
  # ===========================================
  frontend:
    image: sathveegan/learn-sinhala-frontend:${FRONTEND_VERSION:-latest}
    build:
      context: ./frontend
      args:
        BUILD_CONFIG: development
    ports:
      - "80:8080"
    environment:
      PORT: 8080
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
