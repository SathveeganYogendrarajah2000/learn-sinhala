spring:
  application:
    name: learn-sinhala-backend

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/learnsinhala}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-here-change-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  storage:
    # Storage type: local, s3, gcs (future)
    type: ${STORAGE_TYPE:local}

    local:
      # Base path for local file storage
      base-path: ${STORAGE_LOCAL_PATH:./storage}
      # URL prefix for serving files
      base-url: ${STORAGE_LOCAL_URL:/api/files}

    # Future cloud storage config (uncomment when needed)
    # s3:
    #   bucket: ${S3_BUCKET:}
    #   region: ${S3_REGION:}
    #   access-key: ${S3_ACCESS_KEY:}
    #   secret-key: ${S3_SECRET_KEY:}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
