# ===========================================
# Learn Sinhala - Docker Compose (Production)
# Uses MongoDB Atlas (cloud) instead of local MongoDB
# Use: docker-compose -f docker-compose.prod.yml up -d
# ===========================================

version: '3.8'

services:
  # ===========================================
  # Spring Boot Backend (Production)
  # ===========================================
  backend:
    # image: sathveegan/learn-sinhala-backend:${BACKEND_VERSION}
    image: learnsinhala-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learnsinhala-backend-prod
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      
      # MongoDB Atlas connection (from .env.prod)
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI}
      
      # JWT configuration
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      
      # Storage
      STORAGE_LOCAL_PATH: /app/storage
      
      # Server
      SERVER_PORT: 8080
      
      # Production JVM settings
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -Djava.security.egd=file:/dev/./urandom
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_storage_prod:/app/storage
    networks:
      - learnsinhala-prod-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ===========================================
  # Angular Frontend with Nginx (Production)
  # ===========================================
  frontend:
    # image: sathveegan/learn-sinhala-frontend:${FRONTEND_VERSION}
    image: learnsinhala-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learnsinhala-frontend-prod
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "443:443"
    volumes:
      # Mount SSL certificates if using HTTPS
      # - ./docker/ssl:/etc/nginx/ssl:ro
      - ./docker/nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - learnsinhala-prod-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

networks:
  learnsinhala-prod-network:
    driver: bridge

volumes:
  backend_storage_prod:
    driver: local
