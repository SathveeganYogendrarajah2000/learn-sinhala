# ===========================================
# Learn Sinhala - Docker Compose (Production)
# Use: docker-compose -f docker-compose.prod.yml up -d
# ===========================================

version: '3.8'

services:
  # ===========================================
  # MongoDB Database (Production)
  # ===========================================
  mongodb:
    image: mongo:7
    container_name: learnsinhala-mongodb-prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: learnsinhala
    volumes:
      - mongodb_data_prod:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - ./docker/mongod.conf:/etc/mongod.conf:ro
    command: ["mongod", "--config", "/etc/mongod.conf"]
    networks:
      - learnsinhala-prod-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ===========================================
  # Spring Boot Backend (Production)
  # ===========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learnsinhala-backend-prod
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/learnsinhala?authSource=learnsinhala
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 86400000
      STORAGE_LOCAL_PATH: /app/storage
      SERVER_PORT: 8080
      # Production JVM settings
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -Djava.security.egd=file:/dev/./urandom
    volumes:
      - backend_storage_prod:/app/storage
    networks:
      - learnsinhala-prod-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ===========================================
  # Angular Frontend with Nginx (Production)
  # ===========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learnsinhala-frontend-prod
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount SSL certificates if using HTTPS
      # - ./docker/ssl:/etc/nginx/ssl:ro
      - ./docker/nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - learnsinhala-prod-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

networks:
  learnsinhala-prod-network:
    driver: bridge

volumes:
  mongodb_data_prod:
    driver: local
  backend_storage_prod:
    driver: local
